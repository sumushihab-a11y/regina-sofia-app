name: Pubblica Regina Sofia su Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regina-sofia-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del solo repository Regina Sofia
        uses: actions/checkout@v4
      - name: Prepara esclusivamente i file pubblici
        shell: bash
        run: |
          mkdir -p _site
          cp index.html style.css app.js sw.js manifest.webmanifest _site/
          cp -R assets data downloads regina-sofia ordina _site/
          mkdir -p _site/report
          cp report/index.html report/*.csv report/*.json _site/report/
          test -s _site/ordina/app.js
          test -s _site/report/index.html
          test -s _site/downloads/Regina-Sofia-anteprima.apk
          test -s _site/regina-sofia/index.html
          (cd _site/downloads && sha256sum -c SHA256SUMS.txt)
      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
